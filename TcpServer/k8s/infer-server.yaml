# Phase 9 M3: 推論サーバー(CPU 版)を Kubernetes で動かす。
#   適用:  kubectl apply -f k8s/infer-server.yaml
#   確認:  kubectl get pods,svc,endpoints -l app=infer-server
#
# 自作のロードバランサ(lb)と比べると:
#   - 台数を保つ(落ちたら作り直す)       … compose の restart: unless-stopped + 手動の --scale  →  Deployment が、宣言した台数を保つ
#   - 「受け付けてよいか」を見て外す       … lb のヘルスチェック(自作)                          →  readinessProbe + Service の Endpoints
#   - 名前で引ける窓口                      … Docker の DNS(worker)                              →  Service(ClusterIP と DNS)
#   - 振り分け                              … lb(最少接続、自作)                                →  kube-proxy(接続ごとにランダム)
#   - 入れ替え                              … 手動(compose up --build)                          →  ローリング更新(maxUnavailable / maxSurge)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infer-server
  labels: {app: infer-server}
spec:
  replicas: 3
  selector:
    matchLabels: {app: infer-server}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0        # 更新中も、受け付けられる台数を減らさない(新しい 1 台が ready になってから、古い 1 台を止める)
      maxSurge: 1              # 更新中は、一時的に 1 台多く作ってよい
  template:
    metadata:
      labels: {app: infer-server}
    spec:
      terminationGracePeriodSeconds: 15      # 停止の合図(SIGTERM)から、強制終了(SIGKILL)までの猶予。infer_server は SIGTERM で終了処理をする
      containers:
        - name: infer-server
          image: infer-server:cpu-graceful   # kind load docker-image で、ノードに入れたイメージ(cpu = graceful shutdown なしの旧版)
          imagePullPolicy: Never             # レジストリからは取得しない(ノードに無ければ、起動に失敗して気づける)
          args: ["/models/mnist.onnx", "2", "1", "0", "32", "1", "cpu"]
          env:
            # graceful shutdown: SIGTERM のあと 3 秒は受け付けを続け(Pod の削除が kube-proxy に伝わるまでの猶予)、
            # そのあと最大 10 秒、処理中の接続の完了を待つ。3 + 10 = 13 秒 < terminationGracePeriodSeconds(15 秒)
            - {name: INFER_DRAIN_DELAY_MS, value: "3000"}
            - {name: INFER_DRAIN_MAX_MS, value: "10000"}
          ports:
            - {name: infer, containerPort: 8080}
            - {name: metrics, containerPort: 9100}
          # 受け付けてよいか。失敗すると、Service の振り分け先(Endpoints)から外れる。コンテナは再起動しない
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 2                 # 2 秒おき
            failureThreshold: 2              # 2 回連続で失敗したら外す(自作 lb の「2 回連続」と同じ考え方)
            successThreshold: 1
          # 生きているか。失敗が続くと、コンテナが再起動される(固まったプロセスから、自動で復旧する)
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3              # 15 秒続けて失敗したら再起動
          resources:
            requests: {cpu: 500m, memory: 256Mi}   # スケジューラが「置き場所」を決めるときの見積もり
            limits: {memory: 1Gi}                  # メモリを使いすぎたら、そのポッドが落とされる(他のポッドを巻き込まない)
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: models, mountPath: /models, readOnly: true}
      volumes:
        - name: models
          hostPath: {path: /models, type: Directory}   # kind のノードの /models(kind-config.yaml の extraMounts)
---
# 窓口 1: クラスタの内側から、名前 "infer-server" で引ける。3 台のうち、ready なものだけが振り分け先
apiVersion: v1
kind: Service
metadata:
  name: infer-server
  labels: {app: infer-server}
spec:
  selector: {app: infer-server}
  ports:
    - {name: infer, port: 8080, targetPort: infer}
    - {name: metrics, port: 9100, targetPort: metrics}
---
# 窓口 2: 切り替えの試験で、ホスト(127.0.0.1:18080)から届くための穴(kind-config.yaml の extraPortMappings と対)
apiVersion: v1
kind: Service
metadata:
  name: infer-server-nodeport
spec:
  type: NodePort
  selector: {app: infer-server}
  ports:
    - {name: infer, port: 8080, targetPort: infer, nodePort: 30080}
