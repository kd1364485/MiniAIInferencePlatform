# Prometheus の設定。「何を、どのくらいの間隔で取りに行くか」を書く(取得は Prometheus 側から行う = pull 型)
global:
  scrape_interval: 5s          # 5 秒ごとに各 /metrics を取得する(ダッシュボードの細かさの下限)
  evaluation_interval: 15s     # アラートなどのルールを評価する間隔(今回はルール無し)

scrape_configs:
  # 推論サーバー(ワーカー)のメトリクス。台数が増減するので、IP を書かず、DNS で「いまいる全台」を自動で見つける。
  #   "worker" は docker compose のサービス名。複数台なら、全台の IP が引ける(Docker の内蔵 DNS)。
  #   5 秒ごとに引き直すので、ワーカーが増減・再作成されても追従する。各台が instance="<IP>:9100" という別の系列になる
  - job_name: infer-server
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
        refresh_interval: 5s

  # ロードバランサ(自作の lb)のメトリクス: バックエンドごとの up、接続数、失敗数
  - job_name: lb
    static_configs:
      - targets: ["lb:9101"]

  # GPU の使用率・VRAM(monitoring/gpu_exporter.py)
  - job_name: gpu
    static_configs:
      - targets: ["gpu-exporter:9400"]

  # Prometheus 自身(取得の成否、保存量など。ダッシュボードが動かないときの切り分け用)
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
